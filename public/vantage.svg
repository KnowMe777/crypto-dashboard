  />

  <path 
    d="M 55 125 L 90 90 L 115 115 L 165 55" 
    stroke="url(#cryptoGradient)" 
    stroke-width="16" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />

  <path 
    d="M 135 55 L 170 50 L 170 90" 
    stroke="url(#cryptoGradient)" 
    stroke-width="16" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
  />
</svg>