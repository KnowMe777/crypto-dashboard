<svg width="512" height="512" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cryptoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffff" />
      <stop offset="50%" stop-color="#ffff" />
      <stop offset="100%" stop-color="#ffff" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path 
    d="M 160 60 A 75 75 0 1 0 160 140" 
    stroke="url(#cryptoGradient)" 
    stroke-width="20" 
    stroke-linecap="round"
